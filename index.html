<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Samples</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-header">
        <h1>SFNet</h1>
        
        <div class="authors">
            <p>To update</p>
            <p class="affiliation">To update</p>
            <p class="affiliation">To update</p>
        </div>
        
        <div class="abstract">
            <h2>Abstract</h2>
            <p>The abstract will be upated after receiving the comments. Audio samples are already avaible on this website. </p>
        </div>
    </div>

    <div class="sections-wrapper">
        <script>
            function formatSamplingRate(folder) {
    
                if (folder.includes('ablation_study')) {
                    return '8 kHz';
                }
                
                const match = folder.match(/(\d+)k-/);
                if (match) {
                    return `${match[1]} kHz`;
                }
                return folder;
            }
            var sections = {
                "fixed-rate": {
                    title: "I. Audio Samples of Methods Support Fixed Sampling Rate",
                    folders: ["8k-48k", "16k-48k", "24k-48k"],
                    columns: ["Ground Truth", "Cubic", "mdctGAN", "SEANet", "AERO", "AP-BWE", "SFNet", "SFNet-lite"],
                    filenames: ["Ground_Truth", "Cubic", "mdctGAN", "SEANet", "AERO", "AP-BWE", "SFNet", "SFNet-lite"],
                    filePatterns: {
                        "8k-48k": "p364_011_mic1_{type}.wav",
                        "16k-48k": "s5_014_mic1_{type}.wav",
                        "24k-48k": "s5_045_mic1_{type}.wav"
                    }
                },
                "arbitrary-rate": {
                    title: "II. Audio Samples of Methods Support Arbitrary Sampling Rate",
                    folders: ["8k-48k_arbitrary", "16k-48k_arbitrary", "24k-48k_arbitrary"],
                    columns: ["Ground Truth", "NUwave2",  "SEANet", "AERO", "UDM+", "AP-BWE", "SFNet", "SFNet-lite"],
                    filenames: ["Ground_Truth", "NUwave2",  "SEANet", "AERO", "UDM+", "AP-BWE", "SFNet", "SFNet-lite"],
                    filePatterns: {
                        "8k-48k_arbitrary": "p364_011_mic1_{type}.wav",
                        "16k-48k_arbitrary": "s5_014_mic1_{type}.wav",
                        "24k-48k_arbitrary": "s5_045_mic1_{type}.wav"
                    }
                },
                "internal-mechanism": {
                    title: "III. Visualization of the Internal Mechanism",
                    folders: ["ablation_study"],
                    columns: ["Low Resolution", "Sine Waves", "Source-P", "Source-AP", "Source-AP+Source-P", "SFNet" ],
                    filenames: ["Low_Resolution", "Sine_Waves", "Source-P", "Source-AP", "Source-AP+Source-P", "SFNet" ],
                    filePatterns: {
                        "ablation_study": "s5_391_mic1_{type}.wav"
                    }
                },
                "ablation": {
                    title: "IV. Ablation Studies",
                    folders: ["ablation_study2"],
                    columns: ["Ground Truth", "SFNet-R", "SFNet-P",  "-Mag", "-Sin", "-Dis"],
                    filenames: ["Ground_Truth", "SFNet-R", "SFNet-P",  "-Mag", "-Sin", "-Dis"],
                    filePatterns: {
                        "ablation_study2": "s5_391_mic1_{type}.wav"
                    }
                }
            };

            for (let sectionId in sections) {
                const section = sections[sectionId];
                
                document.write(`
                    <div class="section-container" data-section="${sectionId}">
                        <h2>${section.title}</h2>
                        <table class="tg">
                            <tbody>
                                <!-- 添加列标题行 -->
                                <tr>
                                    <td class="tg-header">Input sr</td>
                                    ${section.columns.map(col => `
                                        <td class="tg-header">${col}</td>
                                    `).join('')}
                                </tr>
                `);
                
                section.folders.forEach(folder => {
                    document.write(`<tr>
                        <td class="tg-pcvp">${formatSamplingRate(folder)}</td>`);
                    
                    section.filenames.forEach(col => {
                        const fileName = section.filePatterns[folder].replace('{type}', col);
                        const imgFileName = fileName.replace('.wav', '.png');
                        
                        document.write(`
                            <td class="tg-ihkz">
                                <div class="media-container">
                                    <img src="audio_samples/${folder}/figures/${imgFileName}" 
                                         alt="${col}">
                                    <div class="audio-controls">
                                        <audio controls="controls" 
                                               preload='none'
                                               src="audio_samples/${folder}/${fileName}">
                                        </audio>
                                    </div>
                                </div>
                            </td>
                        `);
                    });
                    
                    document.write(`</tr>`);
                });
                
                document.write(`
                            </tbody>
                        </table>
                    </div>
                `);
            }
        </script>
    </div>
</body>
</html>
